[project]
name = "ripple"
version = "0.1.0"
description = "Ripple: a FalkorDB company brain that corrects everyone who absorbed a stale fact"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["falkordb: needs a running FalkorDB (FALKORDB_HOST/FALKORDB_PORT)"]
