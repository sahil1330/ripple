app = "ripple-api"
primary_region = "iad"

[build]
  dockerfile = "deploy/api.Dockerfile"

[env]
  PORT = "8000"
  RIPPLE_DEFAULT_TENANT = "handbook-demo"
  FALKORDB_PORT = "6379"
  FALKORDB_USERNAME = "default"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
